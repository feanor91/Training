name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Licences SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest
      - name: APK debug (installable sur Android 7+)
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: treadmill-ftms-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Renommer l'APK
        if: github.event_name == 'push'
        run: cp app/build/outputs/apk/debug/app-debug.apk treadmill-ftms.apk
      - name: Publier dans une Release (lien direct)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: treadmill-ftms.apk

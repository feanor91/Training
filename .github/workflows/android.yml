name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Licences SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Clé de signature (secrets du dépôt)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          STORE_PW: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PW: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
              echo "SIGNING_STORE_PASSWORD=$STORE_PW"
              echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
              echo "SIGNING_KEY_PASSWORD=$KEY_PW"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Secret SIGNING_KEYSTORE_B64 absent : APK signé avec une clé de debug éphémère (mise à jour impossible)."
          fi
      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest
      - name: APK debug (installable sur Android 7+)
        run: ./gradlew assembleDebug
      - name: Renommer l'APK
        if: github.event_name == 'push'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk treadmill-ftms.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk treadmill-ftms-montre.apk
      - name: Publier dans une Release (lien direct)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            **Téléphone** : `treadmill-ftms.apk` (s'installe par-dessus la version précédente).
            **Montre Wear OS** : `treadmill-ftms-montre.apk` (installation via adb, voir le README).
          files: |
            treadmill-ftms.apk
            treadmill-ftms-montre.apk
